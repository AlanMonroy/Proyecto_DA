{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correo enviado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'login/css/login.css' %}" />
</head>
<body>
  <div class="page-wrapper" style="justify-content: center; align-items: center;">
    <div class="forms-panel" style="max-width: 440px; width: 100%; text-align: center;">

      <div style="margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; background: #edfaf2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a7a43" stroke-width="1.8">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <h2 style="font-family: 'DM Serif Display', serif; font-size: 1.9rem; margin-bottom: 0.5rem;">Revisa tu correo</h2>
        <p style="color: #6b6b6b; line-height: 1.6;">
          Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña en los próximos minutos.
        </p>
      </div>

      <p style="font-size: 0.85rem; color: #6b6b6b; margin-bottom: 1.5rem;">
        ¿No llegó el correo? Revisa tu carpeta de spam o
        <a href="{% url 'users:password_reset' %}" style="color: #1a1a2e; font-weight: 500;">intenta de nuevo</a>.
      </p>

      <a href="{% url 'users:login' %}" class="btn-submit" style="display: block; text-align: center; text-decoration: none; line-height: 48px;">
        Volver al inicio de sesión
      </a>

    </div>
  </div>
</body>
</html>
