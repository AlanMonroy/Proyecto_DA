{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contraseña restablecida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'login/css/login.css' %}" />
</head>
<body>
  <div class="page-wrapper" style="justify-content: center; align-items: center;">
    <div class="forms-panel" style="max-width: 440px; width: 100%; text-align: center;">

      <div style="margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; background: #edfaf2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a7a43" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 style="font-family: 'DM Serif Display', serif; font-size: 1.9rem; margin-bottom: 0.5rem;">¡Contraseña actualizada!</h2>
        <p style="color: #6b6b6b; line-height: 1.6;">
          Tu contraseña ha sido restablecida exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.
        </p>
      </div>

      <a href="{% url 'users:login' %}" class="btn-submit" style="display: block; text-align: center; text-decoration: none; line-height: 48px;">
        Iniciar sesión
      </a>

    </div>
  </div>
</body>
</html>
