{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'auth/css/auth.css' %}" />
</head>
<body>
  <div class="page-wrapper" style="justify-content: center; align-items: center;">
    <div class="forms-panel" style="max-width: 440px; width: 100%;">

      <div class="form-header" style="margin-bottom: 2rem; text-align: center;">
        <div style="width: 56px; height: 56px; background: #fff8e6; border-radius: 50%;
                    display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 1.25rem;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
               stroke="#a06a00" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2>Cambia tu contraseña</h2>
        <p>Es tu primer inicio de sesión. Por seguridad, elige una nueva contraseña.</p>
      </div>

      {% if error %}
        <div class="msg msg-error" style="margin-bottom: 1rem;">{{ error }}</div>
      {% endif %}

      <form method="POST" novalidate>
        {% csrf_token %}

        <div class="field">
          <label for="password1">Nueva contraseña</label>
          <div class="input-pw-wrap">
            <input
              type="password"
              id="password1"
              name="password1"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pw"
                    aria-label="Mostrar contraseña"
                    data-target="password1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="password2">Confirmar contraseña</label>
          <div class="input-pw-wrap">
            <input
              type="password"
              id="password2"
              name="password2"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pw"
                    aria-label="Mostrar contraseña"
                    data-target="password2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 1.5rem;">
          Guardar nueva contraseña
        </button>
      </form>

    </div>
  </div>
  <script src="{% static 'auth/js/auth.js' %}"></script>
</body>
</html>
