{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'login/css/login.css' %}" />
</head>
<body>
  <div class="page-wrapper" style="justify-content: center; align-items: center;">
    <div class="forms-panel" style="max-width: 440px; width: 100%;">

      <div class="form-header" style="margin-bottom: 2rem;">
        <div class="logo" style="margin-bottom: 1.5rem;">
          <span class="logo-mark" style="background: #1a1a2e;"></span>
          <span class="logo-name" style="color: #1a1a2e;">NombreMarca</span>
        </div>
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
      </div>

      {% if messages %}
        <div class="django-messages">
          {% for message in messages %}
            <div class="msg msg-{{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="field">
          <label for="id_email">Correo electrónico</label>
          <input
            type="email"
            id="id_email"
            name="email"
            placeholder="ana@ejemplo.com"
            required
            autocomplete="email"
          />
        </div>
        <button type="submit" class="btn-submit">Enviar enlace</button>
      </form>

      <p class="form-switch" style="margin-top: 1.5rem;">
        <a href="{% url 'users:login' %}" class="link-btn" style="text-decoration: underline;">
          ← Volver al inicio de sesión
        </a>
      </p>

    </div>
  </div>
</body>
</html>
