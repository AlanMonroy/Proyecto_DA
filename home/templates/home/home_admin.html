{% extends 'base.html' %}
{% load static %}

{% block title %}
    HOME
{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'home/css/home.css' %}">
{% endblock %}

{% block content %}
    <h1>HOME ADMIN</h1>
    {% for opcion in menu_opciones %}
        <li>
          <a href="{% url opcion.url_name %}"
             class="{% if request.resolver_match.url_name == opcion.url_name %}active{% endif %}">
            {{ opcion.nombre }}
          </a>
        </li>
    {% endfor %}
{% endblock %}

{% block scripts %}
    <script src="{% static 'home/js/home.js' %}"></script>
{% endblock %}
